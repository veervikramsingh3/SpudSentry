{% extends "base.html" %}

{% block title %}Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-1 text-danger mb-4">500</h1>
            <h2 class="mb-4">Internal Server Error</h2>
            <p class="lead mb-5">Something went wrong. Our technical team has been notified and is working on the issue.</p>
            <img src="{{ url_for('static', filename='images/500-error.svg') }}" alt="500 Error" class="img-fluid mb-4" style="max-width: 300px;">
            <div class="mt-4">
                <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                    <i class="fas fa-home mr-2"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
